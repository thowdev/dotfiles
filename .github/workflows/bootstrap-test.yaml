name: ChezMoi Bootstrap Validation

on:
  workflow_dispatch:

jobs:
  linux-matrix-test:
    strategy:
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Fedora 42
            image: fedora:42
          - name: openSUSE Leap 15.6
            image: opensuse/leap:15.6
          - name: UBI 8.10
            image: registry.access.redhat.com/ubi8/ubi:8.10
          - name: UBI 9.6
            image: registry.access.redhat.com/ubi9/ubi:9.6
          - name: UBI 10.0
            image: registry.access.redhat.com/ubi10/ubi:10.0

    name: "Test on: ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}

    steps:
      - name: "Step 1: Install prerequisites"
        shell: bash
        run: |
          # Declare a regular array for the package names
          declare -a packages=(
              "curl"
              "gzip"
              "tar"
          )

          declare -a pkgmgrs=(
              "apt-get"
              "dnf"
              "zypper"
          )

          PKG_MGR=""

          for mgr in "${pkgmgrs[@]}"; do
            if command -v "${mgr}" &>/dev/null; then
              PKG_MGR=${mgr}
              break
            fi
          done

          if [[ -z "${PKG_MGR}" ]]; then
            echo "No supported package manager found (apt-get, dnf, zypper)"
            exit 1
          fi

          to_install=()

          # Loop through the commands to check if they're installed
          for cmd in "${packages[@]}"; do
            if ! command -v "${cmd}" &>/dev/null; then
              to_install+=("${cmd}")
            fi
          done

          # Install missing packages
          if (( ${#to_install[@]} > 0 )); then
            echo "Missing package(s): ${to_install[*]}"
            echo "Updating package list and installing missing tools..."

            case "${PKG_MGR}" in
              apt-get)
                apt-get update
                apt-get install -y "${to_install[@]}"
              ;;
              dnf)
                dnf install -y --allowerasing "${to_install[@]}"
              ;;
              zypper)
                zypper install -y "${to_install[@]}"
              ;;
              *)
                echo "Unsupported package manager: ${PKG_MGR}"
                exit 1
              ;;
            esac
          else
            echo "All required tools are already installed."
          fi

      - name: "Step 2: Checkout repo ${{ github.repository }}/${{ github.ref_name }}"
        uses: actions/checkout@v4

      - name: "Step 3: Execute bootstrap script"
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/bootstrap.sh | bash

      - name: "Step 4: Run post-bootstrap validation tests"
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/tests/0-bootstrap-test.sh | BST_SCRIPT_NAME="0-bootstrap-test.sh" bash

  macos-arm:
    name: "Test on: macOS 15 ARM"
    runs-on: macos-15
    steps:
      - name: "Step 1: Execute bootstrap script"
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/bootstrap.sh | bash

      - name: "Step 2: Checkout repo ${{ github.repository }}/${{ github.ref_name }}"
        uses: actions/checkout@v4

      - name: "Step 3: Run post-bootstrap validation tests"
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/tests/0-bootstrap-test.sh | BST_SCRIPT_NAME="0-bootstrap-test.sh" bash
